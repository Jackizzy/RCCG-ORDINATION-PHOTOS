<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#241263">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<!-- Social sharing (WhatsApp, Facebook, X) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{TITLE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{BASE_URL}}/">
<meta property="og:image" content="{{BASE_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{BASE_URL}}/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><img class="brand-logo" src="/logo.png" alt="" draggable="false"><span id="site-title">{{TITLE}}</span></a>
  <nav><a class="nav-link" href="#/find">Find my order</a></nav>
</header>
<div id="demo-banner" class="demo-banner" hidden>Demo mode — payments are simulated. Add Paystack keys in .env to go live.</div>
<main id="app"></main>
<footer class="foot">Previews are watermarked and low resolution. Paid downloads are the full-quality originals — no watermark.</footer>
<div id="overlay-root"></div>
<script src="/app.js"></script>
</body>
</html>
